[project]
name = "sweep"
version = "1.0.16"
description = "Free, open-source Windows 10/11 cleaner and optimiser with a Qt Quick interface"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Alex (Drakedog)" }]

[project.urls]
Homepage = "https://github.com/drakedog-dev/sweep"
Changelog = "https://github.com/drakedog-dev/sweep/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "E701", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]
"app/tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["sweep"]
