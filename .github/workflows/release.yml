name: Build Sweep

# Automatic release: on every push to main the version is read from app/sweep/platform.py.
# If no tag with that version exists, the app is built with PyInstaller, packed with Inno Setup and published.

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read     # SignPath reads the uploaded artifacts

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { shell: pwsh } }
    env:
      # Code signing by SignPath Foundation switches on by itself once the secret and the variable exist
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Read version
        id: ver
        run: |
          $m = [regex]::Match((Get-Content app/sweep/platform.py -Raw), 'APP_VERSION = "([\d\.]+)"')
          if (-not $m.Success) { throw 'APP_VERSION not found' }
          $ver = $m.Groups[1].Value
          $exists = ((git ls-remote --tags origin "refs/tags/v$ver") | Measure-Object).Count -gt 0
          "version=$ver" >> $env:GITHUB_OUTPUT
          "exists=$exists" >> $env:GITHUB_OUTPUT
          Write-Host "Version $ver, tag exists: $exists"

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.exists == 'False'
        with: { python-version: '3.12' }

      - name: Install dependencies
        if: steps.ver.outputs.exists == 'False'
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller==6.11.1

      - name: Build with PyInstaller
        if: steps.ver.outputs.exists == 'False'
        working-directory: app
        run: |
          $ex = @('QtWebEngineCore','QtWebEngineWidgets','QtWebEngineQuick','QtPdf','QtPdfWidgets','QtMultimedia','QtMultimediaWidgets','Qt3DCore','Qt3DRender','Qt3DInput','Qt3DLogic','Qt3DAnimation','Qt3DExtras','QtCharts','QtDataVisualization','QtGraphs','QtQuick3D','QtBluetooth','QtNfc','QtPositioning','QtLocation','QtSensors','QtSerialPort','QtSerialBus','QtSql','QtTest','QtDesigner','QtHelp','QtRemoteObjects','QtScxml','QtStateMachine','QtTextToSpeech','QtWebChannel','QtWebSockets','QtWebView','QtSpatialAudio','QtHttpServer','QtOpenGLWidgets','QtSvgWidgets','QtUiTools','QtXml','QtDBus','QtNetworkAuth','QtQuickWidgets') | % { "--exclude-module=PySide6.$_" }
          python tools/make_version_file.py version_info.txt
          pyinstaller --noconfirm --clean --onedir --windowed --name Sweep --icon sweep.ico --uac-admin --version-file version_info.txt `
            --add-data "qml;qml" --add-data "sweep.ico;." `
            --hidden-import PySide6.QtQuick --hidden-import PySide6.QtQml --hidden-import PySide6.QtQuickControls2 --hidden-import PySide6.QtWidgets `
            $ex main.py
          # prune Qt modules that the exclude list cannot reach (DLLs pulled by QML plugins)
          $prune = 'Qt6WebEngine*','Qt6Pdf*','Qt6Multimedia*','Qt63D*','Qt6Charts*','Qt6DataVis*','Qt6Graphs*','Qt6Quick3D*','Qt6Bluetooth*','Qt6Nfc*','Qt6Positioning*','Qt6Location*','Qt6Sensors*','Qt6Serial*','Qt6Sql*','Qt6Test*','Qt6Designer*','Qt6Help*','Qt6RemoteObjects*','Qt6Scxml*','Qt6StateMachine*','Qt6TextToSpeech*','Qt6WebChannel*','Qt6WebSockets*','Qt6WebView*','Qt6SpatialAudio*','Qt6HttpServer*','Qt6ShaderTools*','Qt6VirtualKeyboard*','Qt6Labs*','opengl32sw.dll','d3dcompiler_47.dll'
          foreach ($p in $prune) { Get-ChildItem dist/Sweep -Recurse -Filter $p -EA SilentlyContinue | Remove-Item -Recurse -Force -EA SilentlyContinue }
          foreach ($d in 'QtWebEngine','QtMultimedia','Qt3D','QtCharts','QtDataVisualization','QtGraphs','Qt5Compat','QtQuick3D','QtLocation','QtPositioning','QtSensors','QtWebView','QtWebChannel','QtRemoteObjects','QtScxml','QtTextToSpeech','QtSpatialAudio','QtVirtualKeyboard') { Get-ChildItem dist/Sweep -Recurse -Directory -Filter $d -EA SilentlyContinue | Remove-Item -Recurse -Force -EA SilentlyContinue }
          Get-ChildItem dist/Sweep -Recurse -File | Measure-Object Length -Sum | % { "Size: {0:N0} MB" -f ($_.Sum/1MB) }

      - name: Smoke test
        if: steps.ver.outputs.exists == 'False'
        working-directory: app
        run: |
          # the exe must ask for administrator rights (UAC) on its own, otherwise privacy and services cannot be changed
          $raw = [IO.File]::ReadAllText((Resolve-Path dist/Sweep/Sweep.exe), [Text.Encoding]::ASCII)
          if ($raw -notmatch 'requireAdministrator') { throw 'Sweep.exe manifest does not request administrator rights' }
          Write-Host 'Manifest: requireAdministrator'
          $vi = (Get-Item dist/Sweep/Sweep.exe).VersionInfo
          Write-Host "Version info: $($vi.ProductName) $($vi.ProductVersion)"
          if ($vi.ProductName -ne 'Sweep') { throw 'Sweep.exe has no product name' }
          Start-Process -FilePath dist/Sweep/Sweep.exe -ArgumentList '--auto','--no-elevate' -Wait -NoNewWindow
          if (Test-Path "$env:ProgramData\Sweep\log.txt") { Get-Content "$env:ProgramData\Sweep\log.txt" | Select-Object -Last 3 }

      # ---- code signing of Sweep.exe (SignPath Foundation), skipped until SignPath is set up ----
      - name: Upload Sweep.exe for signing
        id: up_app
        if: steps.ver.outputs.exists == 'False' && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with: { name: sweep-app-unsigned, path: app/dist/Sweep/Sweep.exe, if-no-files-found: error }

      - name: Sign Sweep.exe
        if: steps.ver.outputs.exists == 'False' && env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'sweep'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'app'
          github-artifact-id: '${{ steps.up_app.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200     # every release waits for manual approval in SignPath
          output-artifact-directory: 'app/signed-app'

      - name: Use signed Sweep.exe
        if: steps.ver.outputs.exists == 'False' && env.SIGNPATH_ENABLED == 'true'
        run: |
          Copy-Item app/signed-app/Sweep.exe app/dist/Sweep/Sweep.exe -Force
          $sig = Get-AuthenticodeSignature app/dist/Sweep/Sweep.exe
          Write-Host "Sweep.exe signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw 'Sweep.exe is not validly signed' }

      - name: Build installer
        if: steps.ver.outputs.exists == 'False'
        working-directory: app
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" Sweep.iss'

      # ---- code signing of the installer ----
      - name: Prepare installer for signing
        if: steps.ver.outputs.exists == 'False' && env.SIGNPATH_ENABLED == 'true'
        run: |
          New-Item -ItemType Directory app/sign-setup -Force | Out-Null
          Copy-Item "app/Output/Sweep-Setup-${{ steps.ver.outputs.version }}.exe" app/sign-setup/Sweep-Setup.exe

      - name: Upload installer for signing
        id: up_setup
        if: steps.ver.outputs.exists == 'False' && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with: { name: sweep-setup-unsigned, path: app/sign-setup/Sweep-Setup.exe, if-no-files-found: error }

      - name: Sign installer
        if: steps.ver.outputs.exists == 'False' && env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'sweep'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'installer'
          github-artifact-id: '${{ steps.up_setup.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: 'app/signed-setup'

      - name: Use signed installer
        if: steps.ver.outputs.exists == 'False' && env.SIGNPATH_ENABLED == 'true'
        run: |
          Copy-Item app/signed-setup/Sweep-Setup.exe "app/Output/Sweep-Setup-${{ steps.ver.outputs.version }}.exe" -Force
          $sig = Get-AuthenticodeSignature "app/Output/Sweep-Setup-${{ steps.ver.outputs.version }}.exe"
          Write-Host "Installer signature: $($sig.Status)"
          if ($sig.Status -ne 'Valid') { throw 'Installer is not validly signed' }

      - name: Create tag
        if: steps.ver.outputs.exists == 'False'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if (((git ls-remote --tags origin "refs/tags/v${{ steps.ver.outputs.version }}") | Measure-Object).Count -gt 0) { Write-Host 'Tag already exists, skipping'; exit 0 }
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: Publish release
        if: steps.ver.outputs.exists == 'False'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Sweep ${{ steps.ver.outputs.version }}
          files: app/Output/Sweep-Setup-*.exe
          generate_release_notes: true
