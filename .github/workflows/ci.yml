name: Lint and tests

# Fast checks on Linux for every push and pull request: code style, unit tests,
# and the whole interface in demo mode (any QML warning fails the run).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write     # only to attach the report to the commit as a git note (pushes to main)

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { shell: bash } }      # bash with pipefail: a failing command before `| tee` fails the step
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: pip, cache-dependency-path: app/requirements.txt }
      # every step writes into ci.txt, so the report (a git note) shows which step failed and why
      - name: System libraries for Qt (offscreen)
        id: apt
        run: (sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3) 2>&1 | tail -20 | tee -a "$RUNNER_TEMP/ci.txt"
      - name: Install
        id: pip
        run: pip install -r app/requirements.txt ruff 2>&1 | tail -20 | tee -a "$RUNNER_TEMP/ci.txt"
      - name: Lint
        id: ruff
        run: ruff check app tools 2>&1 | tee -a "$RUNNER_TEMP/ci.txt"
      - name: Unit tests
        id: unit
        run: |
          python app/tests/test_updates.py 2>&1 | tee -a "$RUNNER_TEMP/ci.txt"
          python app/tests/test_selfupdate.py 2>&1 | tee -a "$RUNNER_TEMP/ci.txt"
      - name: Interface test (demo mode)
        id: ui
        env: { QT_QPA_PLATFORM: offscreen }
        run: |
          python app/main.py --ui-test --no-elevate 2>&1 | tee -a "$RUNNER_TEMP/ci.txt"
          grep 'ui-test' ~/.local/share/Sweep/log.txt | tail -5
      - name: Report
        if: always() && github.event_name == 'push'
        run: |
          echo "steps: apt=${{ steps.apt.outcome }} pip=${{ steps.pip.outcome }} ruff=${{ steps.ruff.outcome }} unit=${{ steps.unit.outcome }} ui=${{ steps.ui.outcome }}" >> "$RUNNER_TEMP/ci.txt"
          python tools/ci_report.py lint ${{ job.status }} "$RUNNER_TEMP/ci.txt" ~/.local/share/Sweep/log.txt
