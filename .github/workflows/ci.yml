name: Lint and tests

# Fast checks on Linux for every push and pull request: code style, unit tests,
# and the whole interface in demo mode (any QML warning fails the run).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: pip, cache-dependency-path: app/requirements.txt }
      - name: System libraries for Qt (offscreen)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 > /dev/null
      - name: Install
        run: pip install -r app/requirements.txt ruff
      - name: Lint
        run: ruff check app tools
      - name: Unit tests
        run: python app/tests/test_updates.py
      - name: Interface test (demo mode)
        env: { QT_QPA_PLATFORM: offscreen }
        run: |
          python app/main.py --ui-test --no-elevate
          grep 'ui-test' ~/.local/share/Sweep/log.txt | tail -5
